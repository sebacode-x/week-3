<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Complete Your Profile - Iyunga Secondary School</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <img src="css/image/logo.svg" alt="Iyunga Secondary School logo" />
      <span>Iyunga Secondary School</span>
    </div>
    <nav>
      <a href="index.html">Home</a>
    </nav>
  </header>
  <main>
    <section class="panel">
      <h1>Complete Your Profile</h1>
      <form id="profileForm" class="ledger-form">
        <div class="field">
          <label>Full Name</label>
          <input type="text" name="fullName" required />
        </div>
        <div class="field">
          <label>Admission Number</label>
          <input type="text" name="admissionNumber" required />
        </div>
        <div class="field">
          <label>Class / Form</label>
          <input type="text" name="className" placeholder="e.g. Form 3" required />
        </div>
        <div class="field">
          <label>Gender</label>
          <select name="gender" required>
            <option value="">Select gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>
        <div class="field">
          <label>Age</label>
          <input type="number" name="age" />
        </div>
        <div class="field">
          <label>Guardian Phone</label>
          <input type="text" name="guardianPhone" />
        </div>
        <button type="submit" class="btn btn-primary">Save Profile</button>
      </form>
      <p id="formMessage" class="form-message"></p>
    </section>
  </main>
  <footer class="site-footer">&copy; 2026 Iyunga Secondary School - Student Portal</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/complete-profile.js"></script>
</body>
</html>
