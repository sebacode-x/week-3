<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Student - Iyunga Secondary School</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="brand">
      <img src="images/logo.svg" alt="Iyunga Secondary School logo" />
      <span>Iyunga Secondary School</span>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="student.html">Students</a>
      <a href="add-student.html" class="active">Add Student</a>
    </nav>
  </header>

  <main>
    <div class="panel">
      <h2 style="text-align:center;">Add New Student</h2>

      <form id="addStudentForm" class="ledger-form">
        <div class="field">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" name="fullName" required />
        </div>

        <div class="field">
          <label for="admissionNumber">Admission Number</label>
          <input type="text" id="admissionNumber" name="admissionNumber" required />
        </div>

        <div class="field">
          <label for="className">Class / Form</label>
          <input type="text" id="className" name="className" placeholder="e.g. Form 3" required />
        </div>

        <div class="field">
          <label for="gender">Gender</label>
          <select id="gender" name="gender" required>
            <option value="">Select gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>

        <div class="field">
          <label for="age">Age</label>
          <input type="number" id="age" name="age" min="1" max="30" />
        </div>

        <div class="field">
          <label for="guardianPhone">Guardian Phone Number</label>
          <input type="text" id="guardianPhone" name="guardianPhone" placeholder="e.g. 0712345678" />
        </div>

        <p id="formMessage" class="form-message"></p>

        <button type="submit" class="btn btn-primary">Save Student</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    &copy; 2026 Iyunga Secondary School - Student Management System
  </footer>

  <script src="js/api.js"></script>
  <script src="js/add-student.js"></script>
</body>
</html>
